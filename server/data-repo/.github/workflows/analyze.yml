# StemStem 데이터 저장소(비공개)에 넣는 워크플로.
# 폰 앱이 inbox/ 에 곡을 올리면 자동으로 6스템 분리 + BPM/키 분석을 하고 songs/ 에 결과를 올린다.
name: Analyze songs

on:
  push:
    paths: ['inbox/*.mp3', 'inbox/*.m4a', 'inbox/*.aac', 'inbox/*.wav', 'inbox/*.flac', 'inbox/*.ogg', 'inbox/*.opus', 'inbox/*.mp4']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: data
      - uses: actions/checkout@v4
        with:
          repository: metukss-bot/stem-stem
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: code/server/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: demucs-htdemucs_6s
      - run: pip install -r code/server/requirements.txt
      - name: Analyze inbox
        run: python code/server/batch.py data
      - name: Save results
        working-directory: data
        run: |
          git config user.name "stemstem-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "분석 결과"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
